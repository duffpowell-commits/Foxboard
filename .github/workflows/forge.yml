name: forge
# Foxboard Forge: FLUX.1-schnell (Apache-2.0) on free public-repo CPU runners via stable-diffusion.cpp.
# Foxboard commits forge/jobs/<id>.json; each version renders on its own runner; results land in forge/results/<id>/.
on:
  push:
    branches: [main]
    paths: ["forge/jobs/**", "!forge/jobs/3d/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: forge, cancel-in-progress: false }
jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: forge }
      - id: p
        run: python forge/plan.py
  render:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120  # backstop only: render_one.py caps each render at 3x its expected time
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        item: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: forge }
      - name: Free disk
        # FLUX schnell + T5 + VAE need ~13 GB; deleting the preinstalled SDKs took ~90 s of every take (Nov 20 runs).
        # Only pay for it when the runner is actually short on space.
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9); echo "free on /: ${avail} GB"
          if [ "${avail:-0}" -lt 20 ]; then sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true; df -h /; fi
      - name: stable-diffusion.cpp
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p sd && cd sd
          url=$(gh api repos/leejet/stable-diffusion.cpp/releases/latest --jq '.assets[].browser_download_url' | grep -i linux | grep -iv -E 'cuda|vulkan|rocm|sycl|arm|aarch' | head -1 || true)
          if [ -n "$url" ]; then curl -sSL -o sd.zip "$url" && unzip -q -o sd.zip || true; fi
          SD=$(find . -type f \( -name sd -o -name sd-cli \) | head -1)
          if [ -z "$SD" ] || ! "$SD" --help >/dev/null 2>&1; then
            git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp src
            cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON >/dev/null
            cmake --build build -j"$(nproc)" --config Release >/dev/null
            SD=$(find build -type f \( -name sd -o -name sd-cli \) -perm -u+x | head -1)
          fi
          echo "SD=$(realpath "$SD")" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$(realpath "$SD")"):$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Models
        run: |
          pip install -q huggingface_hub hf_transfer pillow
          HF_HUB_ENABLE_HF_TRANSFER=1 python forge/get_models.py "${{ matrix.item.job }}"
      - name: Render
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python forge/render_one.py "${{ matrix.item.job }}" "${{ matrix.item.k }}"
      - name: Send to game
        # job field "game": drop the finished take into that game's art inbox (needs the GAME_PUSH_TOKEN secret)
        env: { GAME_PUSH_TOKEN: "${{ secrets.GAME_PUSH_TOKEN }}" }
        run: python forge/send_game.py "${{ matrix.item.job }}" "${{ matrix.item.k }}"
  finish:
    needs: [plan, render]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: forge }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q origin main
          python forge/finish.py
          git add forge/results
          git commit -q -m "[skip ci] forge: done" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
