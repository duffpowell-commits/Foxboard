<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15131c">
<title>Foxboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&family=Bangers&family=Creepster&family=Cinzel:wght@400;700&family=Pirata+One&family=Permanent+Marker&display=swap">
<style>
:root{--bg:#15131c;--panel:#1f1c29;--panel2:#2a2638;--line:#3a3550;--text:#ece8f6;--dim:#9a93b3;--acc:#ff7a3d;--danger:#ff5a6e;--ai:#b98cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header .title{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
header .title small{color:var(--dim);font-weight:400;margin-left:6px}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:40px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
button.acc{background:var(--acc);border-color:var(--acc);color:#1a0d05;font-weight:700}
button.ai{background:var(--ai);border-color:var(--ai);color:#160a26;font-weight:700}
button.danger{color:var(--danger)}
button:disabled{opacity:.35}
button.on{background:var(--acc);color:#1a0d05;border-color:var(--acc)}
#stage{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.floatbar{position:absolute;left:6px;right:6px;bottom:6px;display:none;gap:5px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.floatbar.show{display:flex}
.floatbar>*{pointer-events:auto}
.floatbar button{background:rgba(31,28,41,.94);backdrop-filter:blur(6px);padding:6px 10px}
.floatbar button.on{background:var(--acc)}
#drawbar input[type=color]{width:42px;height:40px}
#drawbar .sz{display:flex;align-items:center;gap:2px;background:rgba(31,28,41,.94);border:1px solid var(--line);border-radius:10px;padding:0 2px}
#drawbar .sz button{border:0;background:transparent;min-height:38px;padding:4px 8px}
#drawbar .sz span{min-width:24px;text-align:center;font-size:13px}
#zoomlbl{position:absolute;top:8px;right:8px;background:rgba(31,28,41,.85);color:var(--dim);padding:3px 8px;border-radius:8px;font-size:12px;pointer-events:none}
#pagebar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#181520;border-top:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
#pagebar::-webkit-scrollbar{display:none}
#pagebar canvas{width:42px;height:42px;border-radius:7px;border:2px solid transparent;background:#0d0b12;flex:none;cursor:pointer}
#pagebar canvas.cur{border-color:var(--acc)}
#pagebar button{min-height:42px;padding:4px 10px;flex:none}
#pagebar .lbl{color:var(--dim);font-size:11px;flex:none}
nav{display:flex;gap:2px;padding:5px;background:var(--panel);border-top:1px solid var(--line);flex:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:5px 1px;background:transparent;border-color:transparent;min-width:0}
nav button span{font-size:19px;line-height:1}
nav button.on{background:var(--panel2);color:var(--acc);border-color:var(--line)}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:66vh;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
#sheet.open{transform:none}
#sheet .sh-head{display:flex;align-items:center;padding:10px 12px 6px;gap:8px}
#sheet .sh-head h3{margin:0;flex:1;font-size:16px}
#sheet .sh-body{overflow:auto;padding:4px 12px 16px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.row>label{color:var(--dim);font-size:13px;min-width:74px}
.row input[type=range]{flex:1;accent-color:var(--acc);min-width:100px}
.row .val{min-width:42px;text-align:right;color:var(--dim);font-size:13px}
input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:2px}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:40px}
input[type=number]{width:86px}
textarea{width:100%;min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{text-align:left;display:flex;flex-direction:column;align-items:flex-start}
.preset small{color:var(--dim)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none}
.layer{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:var(--panel2)}
.layer.sel{border-color:var(--acc)}
.layer .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 4px}
.layer button{min-height:36px;padding:4px 9px}
.layer canvas{width:36px;height:36px;border-radius:6px;background:#0d0b12;flex:none}
.hint{color:var(--dim);font-size:13px;margin:6px 0}
.out{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;font-size:14px;max-height:30vh;overflow:auto}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.swatches i{width:28px;height:28px;border-radius:7px;border:1px solid #0006;display:block;cursor:pointer}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none}
#scrim.open{display:block}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:12px;z-index:50;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(10,8,14,.96);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.overlay.open{display:flex}
.overlay img,.overlay canvas{max-width:100%;max-height:62vh;image-rendering:pixelated;background:repeating-conic-gradient(#2a2638 0 25%,#1f1c29 0 50%) 0 0/16px 16px;border-radius:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="bMenu" aria-label="Menu">☰</button>
    <div class="title" id="docTitle">Foxboard</div>
    <button id="bUndo" aria-label="Undo">↶</button>
    <button id="bRedo" aria-label="Redo">↷</button>
    <button id="bExport" class="acc">Export</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoomlbl">100%</div>
    <div id="ctx" class="floatbar">
      <button data-a="edit">✎ Edit</button>
      <button data-a="dup">⧉</button>
      <button data-a="fwd">▲</button>
      <button data-a="back">▼</button>
      <button data-a="del" class="danger">🗑</button>
    </div>
    <div id="drawbar" class="floatbar">
      <button data-t="pencil" title="Pencil">✏️</button>
      <button data-t="eraser" title="Eraser">🧽</button>
      <button data-t="fill" title="Fill">🪣</button>
      <button data-t="pick" title="Eyedropper">💧</button>
      <input type="color" id="drawColor" value="#ff7a3d">
      <div class="sz"><button id="szDown">−</button><span id="szLbl">1</span><button id="szUp">+</button></div>
      <button id="drawPal">🎨</button>
      <button id="drawDone" class="acc">Done</button>
    </div>
  </div>
  <div id="pagebar"></div>
  <nav>
    <button id="tText"><span>T</span>Text</button>
    <button id="tShape"><span>◼</span>Shape</button>
    <button id="tImg"><span>🖼</span>Image</button>
    <button id="tDraw"><span>✏️</span>Draw</button>
    <button id="tAI"><span>✨</span>AI</button>
    <button id="tLayers"><span>☰</span>Layers</button>
    <button id="tFit"><span>⤢</span>Fit</button>
  </nav>
</div>
<div id="scrim"></div>
<div id="sheet"><div class="sh-head"><h3 id="shTitle"></h3><button id="shClose">Done</button></div><div class="sh-body" id="shBody"></div></div>
<div id="toast"></div>
<div id="imgview" class="overlay"><img id="ivImg" alt="Export preview"><div class="hint">Long-press the image to save it to your phone.</div><button id="ivClose">Close</button></div>
<div id="player" class="overlay"><canvas id="plCv"></canvas><div class="row"><label>Speed</label><input type="range" id="plFps" min="1" max="30" step="1"><span class="val" id="plFpsLbl"></span></div><button id="plClose">Close</button></div>
<input type="file" id="fileImg" accept="image/*" class="hidden">
<input type="file" id="fileFrames" accept="image/*" multiple class="hidden">
<input type="file" id="fileProj" accept=".json,application/json" class="hidden">

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage');
const LS_KEY = 'foxboard.v2';
const FONTS = [
  ['Sans','system-ui, sans-serif'],['Serif','Georgia, serif'],['Mono','ui-monospace, monospace'],['Impact','Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif'],
  ['Pixel (Press Start)','"Press Start 2P", monospace'],['Pixel (VT323)','VT323, monospace'],['Pixel (Silkscreen)','Silkscreen, monospace'],
  ['Comic (Bangers)','Bangers, Impact, sans-serif'],['Horror (Creepster)','Creepster, fantasy'],['Fantasy (Cinzel)','Cinzel, Georgia, serif'],
  ['Gothic (Pirata One)','"Pirata One", serif'],['Marker','"Permanent Marker", cursive']];
const FONT_KEYS = {sans:0,serif:1,mono:2,impact:3,pixel:4,terminal:5,silkscreen:6,comic:7,horror:8,fantasy:9,gothic:10,marker:11};
const PALETTE = ['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa'];
const PRESETS = [
  ['Sprite 32',32,32,true],['Sprite 64',64,64,true],['Sprite 128',128,128,true],['Tile 16',16,16,true],
  ['Portrait 512',512,512,false],['Boss card 750×1050',750,1050,false],['Phone wallpaper',1080,2340,false],
  ['itch.io cover',630,500,false],['Square post',1080,1080,false],['Banner 1920×1080',1920,1080,false]];

let doc = newDoc(64,64,true,'Untitled');
let selId = null;
let view = {z:1,x:0,y:0};
let dpr = 1;
const imgCache = new Map();
const live = new Map(); // paint layer id -> {src, canvas}
let hist = [], fut = [];
let guides = [];
let drawMode = false, tool = 'pencil', brush = 1, recent = [];

function uid(){ return Math.random().toString(36).slice(2,9); }
function newDoc(w,h,pixel,name){ return {name:name||'Untitled',w,h,bg:pixel?'transparent':'#ffffff',pixel:!!pixel,grid:!!pixel,onion:false,fps:8,cur:0,pages:[{id:uid(),objects:[]}]}; }
function migrate(d){
  if(!d||typeof d!=='object') throw 0;
  if(!d.pages){ d.pages=[{id:uid(),objects:Array.isArray(d.objects)?d.objects:[]}]; delete d.objects; }
  if(!d.pages.length) d.pages=[{id:uid(),objects:[]}];
  d.cur=Math.max(0,Math.min(d.pages.length-1,d.cur|0)); d.fps=d.fps||8;
  if(!(d.w>0&&d.h>0)) throw 0;
  return d;
}
function page(){ return doc.pages[doc.cur]; }
function O(){ return page().objects; }
function sel(){ return O().find(o=>o.id===selId)||null; }
function toast(m,ms){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms||1900); }

/* ---------- images ---------- */
function getImg(src){
  let im = imgCache.get(src);
  if(!im){ im = new Image(); im.onload = () => { draw(); thumbsSoon(); }; im.src = src; imgCache.set(src,im); }
  return im;
}
function srcOf(o){ const L=live.get(o.id); if(L&&L.src===o.src) return L.canvas; const im=getImg(o.src); return im.complete&&im.naturalWidth?im:null; }

/* ---------- history ---------- */
let pending = null;
function snap(){ return JSON.stringify(doc); }
function beginEdit(){ if(pending===null) pending = snap(); }
function endEdit(){
  if(pending===null) return;
  if(pending!==snap()){ hist.push(pending); if(hist.length>40) hist.shift(); fut=[]; autosave(); thumbsSoon(); }
  pending=null; updUndo();
}
function edit(fn){ beginEdit(); fn(); endEdit(); draw(); }
function undo(){ endEdit(); if(!hist.length) return; fut.push(snap()); doc=JSON.parse(hist.pop()); afterLoad(); }
function redo(){ endEdit(); if(!fut.length) return; hist.push(snap()); doc=JSON.parse(fut.pop()); afterLoad(); }
function afterLoad(){ if(!sel()) selId=null; autosave(); updUndo(); refreshUI(); renderPages(); draw(); }
function updUndo(){ $('#bUndo').disabled=!hist.length; $('#bRedo').disabled=!fut.length; }

/* ---------- storage ---------- */
let saveT=null;
function autosave(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(LS_KEY, snap()); }catch(e){ toast('Autosave full — Menu › Save project file'); } },500); }
function loadAuto(){ try{ const s=localStorage.getItem(LS_KEY)||localStorage.getItem('foxboard.v1'); if(s) doc=migrate(JSON.parse(s)); }catch(e){} }

/* ---------- geometry ---------- */
function center(o){ return {x:o.x+o.w/2,y:o.y+o.h/2}; }
function rot(v,a){ const c=Math.cos(a),s=Math.sin(a); return {x:v.x*c-v.y*s,y:v.x*s+v.y*c}; }
function toLocal(o,p){ const c=center(o); return rot({x:p.x-c.x,y:p.y-c.y},-(o.rot||0)); }
function corner(o,sx,sy){ const c=center(o); const v=rot({x:sx*o.w/2,y:sy*o.h/2},o.rot||0); return {x:c.x+v.x,y:c.y+v.y}; }
function s2d(px,py){ return {x:(px-view.x)/view.z,y:(py-view.y)/view.z}; }
function d2s(p){ return {x:p.x*view.z+view.x,y:p.y*view.z+view.y}; }
function hitObj(p){
  const a=O();
  for(let i=a.length-1;i>=0;i--){
    const o=a[i]; if(o.hidden||o.locked) continue;
    const l=toLocal(o,p), pad=6/view.z;
    if(Math.abs(l.x)<=o.w/2+pad && Math.abs(l.y)<=o.h/2+pad) return o;
  }
  return null;
}

/* ---------- text ---------- */
const mctx=document.createElement('canvas').getContext('2d');
function fontStr(o){ return `${o.italic?'italic ':''}${o.bold?'700':'400'} ${o.size}px ${o.font}`; }
function fitText(o){
  mctx.font=fontStr(o);
  const lines=(o.text||' ').split('\n');
  let w=0; for(const l of lines) w=Math.max(w,mctx.measureText(l||' ').width);
  const c=center(o);
  o.w=Math.max(1,Math.ceil(w+(o.strokeW||0)));
  o.h=Math.max(1,Math.ceil(lines.length*o.size*1.2));
  o.x=c.x-o.w/2; o.y=c.y-o.h/2;
  if(doc.pixel){ o.x=Math.round(o.x); o.y=Math.round(o.y); }
}
function loadFont(o){ if(!document.fonts||!document.fonts.load) return; document.fonts.load(fontStr(o)).then(()=>{ fitText(o); draw(); thumbsSoon(); }).catch(()=>{}); }

/* ---------- drawing ---------- */
function rr(c,x,y,w,h,r){ r=Math.max(0,Math.min(r||0,Math.abs(w)/2,Math.abs(h)/2)); c.beginPath(); if(c.roundRect) c.roundRect(x,y,w,h,r); else c.rect(x,y,w,h); }
function polygon(c,n,w,h,star){
  c.beginPath(); const pts=star?n*2:n;
  for(let i=0;i<pts;i++){ const a=-Math.PI/2+i*2*Math.PI/pts; const k=star&&i%2?0.45:1; const x=Math.cos(a)*w/2*k, y=Math.sin(a)*h/2*k; i?c.lineTo(x,y):c.moveTo(x,y); }
  c.closePath();
}
function paint(c,o){
  if(o.fill){ c.fillStyle=o.fill; c.fill(); }
  if(o.strokeW>0){ c.lineWidth=o.strokeW; c.strokeStyle=o.stroke; c.lineJoin='round'; c.stroke(); }
}
function filterOf(o){
  const a=o.adj; if(!a) return 'none';
  const f=[];
  if(a.b!==undefined&&a.b!==100) f.push(`brightness(${a.b}%)`);
  if(a.c!==undefined&&a.c!==100) f.push(`contrast(${a.c}%)`);
  if(a.s!==undefined&&a.s!==100) f.push(`saturate(${a.s}%)`);
  if(a.h) f.push(`hue-rotate(${a.h}deg)`);
  if(a.g) f.push(`grayscale(${a.g}%)`);
  if(a.blur) f.push(`blur(${a.blur}px)`);
  return f.length?f.join(' '):'none';
}
function drawObj(c,o){
  if(o.hidden) return;
  c.save();
  c.globalAlpha*=o.opacity??1;
  const ct=center(o); c.translate(ct.x,ct.y); c.rotate(o.rot||0);
  c.scale(o.flipX?-1:1,o.flipY?-1:1);
  const w=o.w,h=o.h;
  if(o.type==='rect'){ rr(c,-w/2,-h/2,w,h,o.radius); paint(c,o); }
  else if(o.type==='ellipse'){ c.beginPath(); c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2); paint(c,o); }
  else if(o.type==='tri'){ polygon(c,3,w,h,false); paint(c,o); }
  else if(o.type==='star'){ polygon(c,5,w,h,true); paint(c,o); }
  else if(o.type==='line'){ c.beginPath(); c.moveTo(-w/2,0); c.lineTo(w/2,0); c.lineCap='round'; c.lineWidth=Math.max(1,o.strokeW||h); c.strokeStyle=o.stroke; c.stroke(); }
  else if(o.type==='text'){
    c.font=fontStr(o); c.textBaseline='top'; c.textAlign=o.align||'left';
    const lines=(o.text||'').split('\n'), lh=o.size*1.2, sw=o.strokeW||0;
    const x=o.align==='center'?0:o.align==='right'?w/2-sw/2:-w/2+sw/2;
    lines.forEach((l,i)=>{ const y=-h/2+i*lh+(lh-o.size)/2;
      if(sw>0){ c.lineWidth=sw; c.strokeStyle=o.stroke; c.lineJoin='round'; c.strokeText(l,x,y); }
      c.fillStyle=o.fill||'#000'; c.fillText(l,x,y); });
  }
  else if(o.type==='image'){ const s=srcOf(o); if(s){ const f=filterOf(o); if(f!=='none') c.filter=f; c.drawImage(s,-w/2,-h/2,w,h); } }
  c.restore();
}
function renderPage(c,pi,scale,jpg,d){
  d=d||doc; const pg=d.pages[pi];
  c.save(); c.scale(scale,scale);
  c.imageSmoothingEnabled=!d.pixel;
  if(d.bg && d.bg!=='transparent'){ c.fillStyle=d.bg; c.fillRect(0,0,d.w,d.h); }
  else if(jpg){ c.fillStyle='#fff'; c.fillRect(0,0,d.w,d.h); }
  for(const o of pg.objects) drawObj(c,o);
  c.restore();
}
let checker=null;
function checkerPat(){
  if(checker) return checker;
  const p=document.createElement('canvas'); p.width=p.height=16; const g=p.getContext('2d');
  g.fillStyle='#3b3650'; g.fillRect(0,0,16,16); g.fillStyle='#2b2739'; g.fillRect(0,0,8,8); g.fillRect(8,8,8,8);
  return checker=ctx.createPattern(p,'repeat');
}
let raf=0;
function draw(){ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; drawNow(); }); }
function drawNow(){
  const W=cv.width, H=cv.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#100e16'; ctx.fillRect(0,0,W,H);
  const tl=d2s({x:0,y:0}), DW=doc.w*view.z, DH=doc.h*view.z;
  ctx.save(); ctx.scale(dpr,dpr);
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(tl.x+4,tl.y+6,DW,DH);
  ctx.save(); ctx.beginPath(); ctx.rect(tl.x,tl.y,DW,DH); ctx.clip();
  if(!doc.bg||doc.bg==='transparent'){ ctx.fillStyle=checkerPat(); ctx.fillRect(tl.x,tl.y,DW,DH); }
  ctx.translate(view.x,view.y); ctx.scale(view.z,view.z);
  if(doc.onion && doc.cur>0){
    ctx.save(); ctx.globalAlpha=0.28; ctx.imageSmoothingEnabled=!doc.pixel;
    for(const o of doc.pages[doc.cur-1].objects) drawObj(ctx,o);
    ctx.restore();
  }
  renderPage(ctx,doc.cur,1,false);
  ctx.restore();
  if(doc.grid && view.z>=6){
    ctx.beginPath(); ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
    for(let x=0;x<=doc.w;x++){ const s=Math.round(tl.x+x*view.z)+.5; ctx.moveTo(s,tl.y); ctx.lineTo(s,tl.y+DH); }

/* ---------- pointer ---------- */
const ptrs=new Map(); let act=null;

});

function readImage(file){

      if(Math.max(iw,ih)>MAX || !/^data:image\/(png|jpeg|webp|gif)/.test(src)){ const k=Math.min(1,MAX/Math.max(iw,ih)); const c=document.createElement('canvas'); c.width=Math.round(iw*k); c.height=Math.round(ih*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); src=c.toDataURL('image/png'); iw=c.width; ih=c.height; }

  // reference = most common color among border pixels
  const counts=new Map(); const key=i=>((d[i]>>3)<<10)|((d[i+1]>>3)<<5)|(d[i+2]>>3);
  const border=[]; for(let x=0;x<W;x++){ border.push(x,(H-1)*W+x); } for(let y=0;y<H;y++){ border.push(y*W,y*W+W-1); }
  for(const p of border){ const i=p*4; if(d[i+3]<16) continue; const k=key(i); counts.set(k,(counts.get(k)||0)+1); }
  if(!counts.size){ toast('Background is already transparent'); return; }
  let best=0,bk=0; counts.forEach((v,k)=>{ if(v>best){best=v;bk=k;} });
  let rs=0,gs=0,bs=0,n=0; for(const p of border){ const i=p*4; if(d[i+3]>=16&&key(i)===bk){ rs+=d[i];gs+=d[i+1];bs+=d[i+2];n++; } }
  const ref=[rs/n,gs/n,bs/n];
  const dist=i=>Math.hypot(d[i]-ref[0],d[i+1]-ref[1],d[i+2]-ref[2]);
  const seen=new Uint8Array(W*H), st=[];
  for(const p of border){ if(dist(p*4)<=tol || d[p*4+3]<16) st.push(p); }
  let cleared=0;
  while(st.length){ const p=st.pop(); if(seen[p]) continue; seen[p]=1; const i=p*4;
    if(d[i+3]>=16 && dist(i)>tol) continue;
    const dd=dist(i); d[i+3]=dd>tol*0.6?Math.round(d[i+3]*Math.min(1,(dd-tol*0.6)/(tol*0.4+1e-6))):0; cleared++;
    const x=p%W,y=(p/W)|0; if(x>0) st.push(p-1); if(x<W-1) st.push(p+1); if(y>0) st.push(p-W); if(y<H-1) st.push(p+W); }
  g.putImageData(id,0,0);
  const src=c.toDataURL('image/png');
  edit(()=>{ o.src=src; o.natW=W; o.natH=H; });
  toast(cleared?`Removed ${Math.round(cleared/(W*H)*100)}% of pixels`:'Nothing matched — raise tolerance');
}

const AI_RULES='Make ORIGINAL designs only — never copy an existing copyrighted or trademarked character, logo or artwork; if asked for one, make an original character with a similar mood instead.';
function aiErr(e){
  const c=e&&e.code;
  if(c==='cancelled') return 'Stopped.';
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled') return 'AI is switched off for this page. Reopen Foxboard inside the Claude app and tap Allow when asked.';
  if(c==='rate_limited') return 'Claude usage limit or too many requests — wait a bit and try again.';
  if(c==='refused') return 'Claude declined that one — reword the prompt.';
  if(c==='invalid_json') return 'Claude\'s answer didn\'t parse. Try again or simplify the prompt.';
  if(c==='session_expired') return 'Sign in to Claude again.';
  return 'Something went wrong ('+(c||'error')+'). Try again.';
}
function parsePixels(j,N){
  if(!j||!Array.isArray(j.rows)||!Array.isArray(j.palette)) throw {code:'invalid_json'};
  const pal=j.palette.map(c=>toHex(String(c)));
  let rows=j.rows.map(r=>String(r));
  const H=Math.min(256,rows.length), W=Math.min(256,Math.max(...rows.map(r=>r.length)));
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  for(let y=0;y<H;y++){ const r=rows[y]; for(let x=0;x<W;x++){ const ch=r[x]; if(!ch||ch==='.'||ch===' ') continue; const k=parseInt(ch,36); if(isNaN(k)||!pal[k]) continue; g.fillStyle=pal[k]; g.fillRect(x,y,1,1); } }
  return {src:c.toDataURL('image/png'),w:W,h:H};
}
function cleanSVG(txt,W,H){
  const m=String(txt).match(/<svg[\s\S]*<\/svg>/i); if(!m) throw {code:'invalid_json'};
  const d=new DOMParser().parseFromString(m[0],'image/svg+xml');
  if(d.querySelector('parsererror')) throw {code:'invalid_json'};
  const svg=d.documentElement;
  svg.querySelectorAll('script,foreignObject,iframe,image,audio,video').forEach(n=>n.remove());
  for(const el of [svg,...svg.querySelectorAll('*')]){ for(const a of [...el.attributes]){ const n=a.name.toLowerCase(); if(n.startsWith('on')) el.removeAttribute(a.name); else if((n==='href'||n==='xlink:href')&&!a.value.trim().startsWith('#')) el.removeAttribute(a.name); else if(/url\(\s*['"]?(?!#)/i.test(a.value)) el.removeAttribute(a.name); } }
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  if(!svg.getAttribute('viewBox')) svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const vb=svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
  const vw=vb[2]>0?vb[2]:W, vh=vb[3]>0?vb[3]:H;
  svg.setAttribute('width',vw); svg.setAttribute('height',vh);
  return {src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg)),w:vw,h:vh};
}
function loadSrc(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; imgCache.set(src,im); }); }
async function svgToPng(src,w,h){ const im=await loadSrc(src); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h)); c.getContext('2d').drawImage(im,0,0,c.width,c.height); return c.toDataURL('image/png'); }

/* ---------- Forge: FLUX.1-schnell on free GitHub runners (repo Foxboard, forge/) ---------- */
const FORGE_REPO={owner:'duffpowell-commits',repo:'Foxboard'};
const FORGE_SIZES=[['Square 768 (~15 min)',768,768,15],['Square 512 (~7 min)',512,512,7],['Square 1024 (~27 min)',1024,1024,27],['Portrait 576×1024 (~16 min)',576,1024,16],['Landscape 1024×576 (~16 min)',1024,576,16]];
const FORGE_LS='foxboard.forgejobs';
let forgeJobs=[]; const forgeImgs=new Map(); let forgeChecking=false;
function forgeLoadLocal(){ try{ const a=JSON.parse(localStorage.getItem(FORGE_LS)||'[]'); if(Array.isArray(a)) forgeJobs=a; }catch(e){} }
function forgeSaveLocal(){ try{ localStorage.setItem(FORGE_LS,JSON.stringify(forgeJobs.slice(0,30))); }catch(e){} }
forgeLoadLocal();
function keyName(hx){ return /^#?ff00ff$/i.test(hx)?'magenta (#FF00FF)':/^#?00ff00$/i.test(hx)?'pure green (#00FF00)':hx; }
function forgeEta(j){ const per=(FORGE_SIZES.find(z=>z[1]===j.w&&z[2]===j.h)||[0,0,0,15])[3]; return (per+5)*60000; }
function forgeText(res){
  const parts=[]; for(const c of (res&&res.content)||[]){ if(c.type==='text') parts.push(c.text); else if(c.resource){ if(c.resource.text) parts.push(c.resource.text); else if(c.resource.blob){ try{ parts.push(atob(c.resource.blob)); }catch(e){} } } }
  if(typeof res?.payload==='string') parts.push(res.payload);
  return parts.join('\n');
}
async function forgeFetch(path){ return forgeText(await mcpCap.callTool('github','get_file_contents',{...FORGE_REPO,path},{cache:false})); }
async function forgeCheck(j){
  let changed=false;
  for(let k=0;k<j.n;k++){
    if((j.got||[]).includes(k)||(j.failed||[]).includes(k)) continue;
    try{
      const t=await forgeFetch(`forge/results/${j.id}/${k}.b64`);
      const m=t.match(/(png|webp):([A-Za-z0-9+/=]{200,})/);
      if(m){ forgeImgs.set(j.id+'/'+k,`data:image/${m[1]};base64,${m[2]}`); j.got=[...(j.got||[]),k]; changed=true; }
    }catch(e){ if(e&&e.code!=='tool_error') throw e; }
  }
  if((j.got||[]).length<j.n && Date.now()-j.at>forgeEta(j)){
    try{ const d=JSON.parse((await forgeFetch(`forge/results/${j.id}/done.json`)).replace(/^[^{]*/,'').replace(/[^}]*$/,'')); if(Array.isArray(d.failed)){ j.failed=d.failed; changed=true; } }catch(e){}
  }
  j.state=(j.got||[]).length+(j.failed||[]).length>=j.n?'done':'rendering';
  if(changed) forgeSaveLocal();
  return changed;
}
async function forgeImgFor(j,k){
  const key=j.id+'/'+k; if(forgeImgs.has(key)) return forgeImgs.get(key);
  const t=await forgeFetch(`forge/results/${j.id}/${k}.b64`); const m=t.match(/(png|webp):([A-Za-z0-9+/=]{200,})/);
  if(!m) return null; const u=`data:image/${m[1]};base64,${m[2]}`; forgeImgs.set(key,u); return u;
}
async function forgeAdd(u,name){
  const png=await (async()=>{ const im=await loadSrc(u); const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0); return {src:c.toDataURL('image/png'),w:c.width,h:c.height}; })();

/* ---------- GIF encoder (home-made: median-cut palette + LZW) ---------- */
function quantize(data){
  // data: RGBA Uint8ClampedArray. Returns {palette:[[r,g,b]], idx:Uint8Array, trans:-1|index}
  const n=data.length/4, counts=new Map(); let hasTrans=false;
  for(let i=0;i<n;i++){ const j=i*4; if(data[j+3]<128){ hasTrans=true; continue; } const k=((data[j]>>3)<<10)|((data[j+1]>>3)<<5)|(data[j+2]>>3); counts.set(k,(counts.get(k)||0)+1); }
  const maxC=hasTrans?255:256;
  let pal;
  const exact=new Map(); let exactOk=true;
  for(let i=0;i<n&&exactOk;i++){ const j=i*4; if(data[j+3]<128) continue; const k=(data[j]<<16)|(data[j+1]<<8)|data[j+2]; if(!exact.has(k)){ exact.set(k,exact.size); if(exact.size>maxC) exactOk=false; } }
  const idx=new Uint8Array(n);
  if(exactOk){
    pal=[...exact.keys()].map(k=>[(k>>16)&255,(k>>8)&255,k&255]);
    const t=hasTrans?pal.length:-1;
    for(let i=0;i<n;i++){ const j=i*4; idx[i]=data[j+3]<128?t:exact.get((data[j]<<16)|(data[j+1]<<8)|data[j+2]); }
    if(hasTrans) pal.push([0,0,0]);
    return {palette:pal,idx,trans:t};
  }
  let boxes=[[...counts.entries()].map(([k,c])=>[((k>>10)&31)<<3|4,((k>>5)&31)<<3|4,(k&31)<<3|4,c])];
  while(boxes.length<maxC){
    let bi=-1,best=0,ch=0;
    boxes.forEach((b,i)=>{ if(b.length<2) return; for(let c=0;c<3;c++){ let mn=255,mx=0; for(const p of b){ if(p[c]<mn)mn=p[c]; if(p[c]>mx)mx=p[c]; } const sc=(mx-mn)*Math.sqrt(b.length); if(sc>best){best=sc;bi=i;ch=c;} } });
    if(bi<0) break;
    const b=boxes[bi].sort((x,y)=>x[ch]-y[ch]); const tot=b.reduce((s,p)=>s+p[3],0); let acc=0,k=0;
    for(;k<b.length-2;k++){ acc+=b[k][3]; if(acc>=tot/2) break; }
    boxes.splice(bi,1,b.slice(0,k+1),b.slice(k+1));
  }
  pal=boxes.map(b=>{ let r=0,g=0,bl=0,t=0; for(const p of b){ r+=p[0]*p[3]; g+=p[1]*p[3]; bl+=p[2]*p[3]; t+=p[3]; } return [Math.round(r/t),Math.round(g/t),Math.round(bl/t)]; });
  const look=new Int16Array(32768).fill(-1);
  const nearest=k=>{ if(look[k]>=0) return look[k]; const r=((k>>10)&31)<<3|4,g=((k>>5)&31)<<3|4,b=(k&31)<<3|4; let bi=0,bd=1e9; for(let i=0;i<pal.length;i++){ const p=pal[i]; const d=(p[0]-r)**2*2+(p[1]-g)**2*4+(p[2]-b)**2*3; if(d<bd){bd=d;bi=i;} } look[k]=bi; return bi; };
  const t=hasTrans?pal.length:-1;
  for(let i=0;i<n;i++){ const j=i*4; idx[i]=data[j+3]<128?t:nearest(((data[j]>>3)<<10)|((data[j+1]>>3)<<5)|(data[j+2]>>3)); }
  if(hasTrans) pal.push([0,0,0]);
  return {palette:pal,idx,trans:t};
}
function lzw(indices,minCode,out){
  const clear=1<<minCode, eoi=clear+1; let codeSize=minCode+1, next=eoi+1; const dict=new Map();
  const bytes=[]; let cur=0,bits=0;
  const emit=c=>{ cur|=c<<bits; bits+=codeSize; while(bits>=8){ bytes.push(cur&255); cur>>>=8; bits-=8; } };
  emit(clear); let prefix=indices[0];
  for(let i=1;i<indices.length;i++){
    const k=indices[i], key=(prefix<<8)|k, v=dict.get(key);
    if(v!==undefined){ prefix=v; continue; }
    emit(prefix);
    if(next===4096){ emit(clear); dict.clear(); codeSize=minCode+1; next=eoi+1; }
    else { if(next>=(1<<codeSize)) codeSize++; dict.set(key,next++); }
    prefix=k;
  }
  emit(prefix); emit(eoi); if(bits>0) bytes.push(cur&255);
  out.push(minCode);
  for(let i=0;i<bytes.length;i+=255){ const ch=bytes.slice(i,i+255); out.push(ch.length); for(const b of ch) out.push(b); }

function encodeGIF(frames,W,H,delayCs){
  const o=[]; const u16=v=>{ o.push(v&255,(v>>8)&255); }; const str=s=>{ for(const c of s) o.push(c.charCodeAt(0)); };

  o.push(0x21,0xFF,0x0B); str('NETSCAPE2.0'); o.push(3,1,0,0,0);
  for(const f of frames){
    const q=quantize(f.data);
    let bitsN=1; while((1<<bitsN)<q.palette.length) bitsN++;
    o.push(0x21,0xF9,4,(2<<2)|(q.trans>=0?1:0)); u16(delayCs); o.push(q.trans>=0?q.trans:0,0);
    o.push(0x2C); u16(0); u16(0); u16(W); u16(H); o.push(0x80|(bitsN-1));
    for(let i=0;i<(1<<bitsN);i++){ const p=q.palette[i]||[0,0,0]; o.push(p[0],p[1],p[2]); }
    lzw(q.idx,Math.max(2,bitsN),o);
  }
  o.push(0x3B);
  return new Blob([new Uint8Array(o)],{type:'image/gif'});
}
function makeGIF(scale){
  const W=Math.max(1,Math.round(doc.w*scale)), H=Math.max(1,Math.round(doc.h*scale));
  const frames=doc.pages.map((p,i)=>renderToCanvas(scale,false,i).getContext('2d').getImageData(0,0,W,H));
  return encodeGIF(frames,W,H,Math.max(2,Math.round(100/(doc.fps||8))));
}

  const canEditBible=!userCap||userIsOwner||bibleSrc!=='shared';
  openSheet('📖 Style bible','bible',b=>{
    const tabs=h('div',{class:'tabs'});
    bible.games.forEach(g=>{ const bt=h('button',{class:g.id===gid?'on':''},g.name); bt.onclick=()=>openBible(g.id); tabs.append(bt); });
    b.append(tabs);
    const g=gameById(gid); if(!g){ b.append(h('div',{class:'hint'},'No games yet.')); return; }
    b.append(h('div',{class:'hint'},bibleSrc==='shared'?'Shared with everyone on Foxboard. AI, palettes and Send to game all read this.':'AI, palettes and Send to game all read this.'));
    b.append(row('Use it',h('button',{class:g.id===activeGame?'on':'',onclick:()=>{ setActiveGame(g.id===activeGame?'':g.id); openBible(gid); }},g.id===activeGame?'✓ Active game':'Make active')));
    const sw=h('div',{class:'swatches'});
    g.palette.forEach((c,i)=>{ const it=h('i',{title:c}); it.style.background=c; it.onclick=()=>{ setColor(c); toast('Draw color '+c); }; if(canEditBible) it.oncontextmenu=e=>{ e.preventDefault(); g.palette.splice(i,1); openBible(gid); }; sw.append(it); });
    b.append(h('div',{class:'hint'},'Palette — tap = draw with it'+(canEditBible?' · long-press = remove':'')));
    b.append(sw);
    if(canEditBible) b.append(row('',h('button',{onclick:()=>{ const c=$('#drawColor').value; if(!g.palette.includes(c)) g.palette.push(c); openBible(gid); }},'＋ Add current draw color')));
    const sp=h('textarea',{}); sp.value=g.sprite; const hd=h('textarea',{}); hd.value=g.hd;
    if(!canEditBible){ sp.readOnly=true; hd.readOnly=true; }
    b.append(h('div',{class:'hint'},'Pixel sprite style'),sp,h('div',{class:'hint'},'Illustration / card style'),hd);
    const keyIn=h('input',{type:'color',value:g.key||'#FF00FF'}); keyIn.disabled=!canEditBible;
    b.append(row('Key color',keyIn,h('span',{class:'hint'},'flat background the game\'s importer cuts out')));
    b.append(row('Repo',h('span',{},g.repo+' › '+g.inbox+'/')));
    const decB=h('button',{class:g.decoder===false?'':'on'},g.decoder===false?'Inbox decoder: not installed':'Inbox decoder: installed ✓'); decB.disabled=!canEditBible;
    decB.onclick=()=>{ g.decoder=g.decoder===false; openBible(gid); toast('Save the bible to keep this'); };
    const dirB=h('button',{class:g.direct?'on':''},g.direct?'Send: direct via GitHub connector':'Send: outbox + sweep'); dirB.disabled=!canEditBible;
    dirB.onclick=()=>{ g.direct=!g.direct; openBible(gid); toast('Save the bible to keep this'); };
    b.append(row('Send to game',dirB),row('',decB));
    b.append(h('h4',{style:'margin:12px 0 4px'},'Characters'));
    bible.characters.filter(c=>c.game===gid).forEach(c=>{
      const ta=h('textarea',{}); ta.value=c.look; ta.readOnly=!canEditBible; ta.oninput=()=>{ c.look=ta.value; };
      const nm=h('input',{type:'text',value:c.name}); nm.readOnly=!canEditBible; nm.oninput=()=>{ c.name=nm.value; }; nm.style.flex='1';
      b.append(row('',nm,canEditBible?h('button',{class:'danger',onclick:()=>{ bible.characters=bible.characters.filter(x=>x!==c); openBible(gid); }},'🗑'):''),ta);
    });
    if(canEditBible) b.append(row('',h('button',{onclick:()=>{ bible.characters.push({id:uid(),name:'New character',game:gid,look:'Describe how they look: build, hair, face, clothes, marks.'}); openBible(gid); }},'＋ Add character')));
    if(canEditBible){
      const sv=h('button',{class:'acc'},'💾 Save bible');
      sv.onclick=async()=>{ g.sprite=sp.value; g.hd=hd.value; g.key=keyIn.value; sv.disabled=true; const w=await saveBible(); sv.disabled=false; toast(w==='shared'?'Bible saved for everyone':'Bible saved on this phone'); };
      b.append(row('',sv,h('button',{onclick:()=>{ bible=JSON.parse(JSON.stringify(DEFAULT_BIBLE)); openBible(gid); toast('Reset to defaults — Save to keep'); }},'Reset to defaults')));
    } else b.append(h('div',{class:'hint'},'Only Duff can edit the bible.'));
  });
}

/* ---------- send to game (GitHub connector) ---------- */
let mcpCap=null;
(async()=>{ try{ if(window.claude&&window.claude.use) mcpCap=await window.claude.use('mcp'); }catch(e){ mcpCap=null; } })();
function blobToB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]||''); fr.onerror=rej; fr.readAsDataURL(blob); }); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function onKey(c,key){ const k=document.createElement('canvas'); k.width=c.width; k.height=c.height; const g=k.getContext('2d'); g.fillStyle=key; g.fillRect(0,0,k.width,k.height); g.drawImage(c,0,0); return k; }
function ghErr(e){
  const c=e&&e.code;
  if(c==='server_not_connected') return 'GitHub isn\'t connected. Add it in Claude: Settings › Connectors › GitHub, then try again.';
  if(c==='needs_reauth') return 'GitHub sign-in expired. Reconnect it in Claude: Settings › Connectors.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required') return 'Foxboard needs your OK to use GitHub — tap Send again and Allow.';
  if(c==='blocked_by_policy') return 'Your Claude org blocks this GitHub tool.';
  if(c==='selection_required') return 'Pick which GitHub connector to use in the prompt Claude shows, then try again.';
  if(c==='tool_error'&&/\b404\b|Not Found/i.test(String(e.message||''))) return 'GitHub says it can\'t see that repo. It\'s private and your GitHub connector only has public access. On github.com (phone browser): Settings › Applications › the Claude/Anthropic app › Configure › give it access to this repo. Then Send again.';
  if(c==='tool_error') return 'GitHub said no: '+String(e.message||'').slice(0,160);
  if(c==='server_unavailable'||c==='upstream_error') return 'GitHub didn\'t answer — it may or may not have landed. Check the repo before sending again.';
  return 'Couldn\'t send ('+(c||'error')+').';
}
let outboxItems=[];
async function sha256hex(blob){ const b=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function queueOutbox(g,name,ext,blob,dir,file){
  const b64=await blobToB64(blob); const CH=180000;
  if(b64.length>CH*40) throw {code:'too_big'};
  const id=Date.now().toString(36)+uid(); const n=Math.ceil(b64.length/CH);
  for(let i=0;i<n;i++) await dbCap.doc(`outboxchunks/${id}_${i}`).set({item:id,n:i,data:b64.slice(i*CH,(i+1)*CH)});
  await dbCap.doc(`outbox/${id}`).set({game:g.id,gameName:g.name,repo:g.repo,dir,file,ext,name,bytes:blob.size,sha256:await sha256hex(blob),chunks:n,by:myUserId||'',at:Date.now(),status:'queued'});
  return id;
}
function outboxLine(it){
  const st=it.status==='delivered'?'✅':it.status==='error'?'❌':'⏳';
  const d=h('div',{class:'hint'}); d.append(`${st} ${it.name}.${it.ext} → ${it.gameName||it.game} · ${fmtDate(it.at)} · `);
  if(it.status==='delivered'&&it.path) d.append(h('a',{href:`https://github.com/${it.repo}/blob/main/${it.path}`,target:'_blank',rel:'noopener'},'in repo'));
  else d.append(it.status==='error'?String(it.error||'failed').slice(0,120):'waiting for the next sweep');
  return d;
}
function openSendToGame(){
  if(drawMode) setDrawMode(false);
  selId=null; refreshUI(); draw();
  openSheet('🎮 Send to game','send',b=>{
    if(!mcpCap&&!dbCap){ b.append(h('div',{class:'out'},'Send to game works when Foxboard is open inside the Claude app. Here, use Export instead.')); return; }

    if(!games.length){ b.append(h('div',{class:'hint'},'Add a game with a repo in the Style bible first.')); return; }
    let gid=gameById(activeGame)&&gameById(activeGame).repo?activeGame:games[0].id;
    const gs=h('select',{}); games.forEach(g=>{ const op=h('option',{value:g.id},g.name); if(g.id===gid) op.selected=true; gs.append(op); });
    const ni=h('input',{type:'text',value:slug()}); ni.style.flex='1';
    const multi=doc.pages.length>1;
    let what=multi?'sheet':'frame', scale=1, keyBg=doc.pixel&&(!doc.bg||doc.bg==='transparent');
    const wb=[['frame','This frame'],['sheet','Sprite sheet'],['gif','GIF']].filter(([k])=>multi||k==='frame').map(([k,l])=>{ const bt=h('button',{},l); bt.dataset.k=k; bt.onclick=()=>{ what=k; upd(); }; return bt; });
    const sb=[1,2,4].filter(s=>Math.max(doc.w,doc.h)*s<=4096).map(s=>{ const bt=h('button',{},s+'×'); bt.dataset.s=s; bt.onclick=()=>{ scale=s; upd(); }; return bt; });
    const kb=h('button',{},'Key-color background'); kb.onclick=()=>{ keyBg=!keyBg; upd(); };
    const info=h('div',{class:'hint'}), out=h('div',{class:'out hidden'});
    function upd(){
      const g=gameById(gs.value)||games[0];
      wb.forEach(x=>x.classList.toggle('on',x.dataset.k===what)); sb.forEach(x=>x.classList.toggle('on',+x.dataset.s===scale));
      kb.classList.toggle('on',keyBg&&what!=='gif'); kb.disabled=what==='gif'; kb.textContent=`Key-color background (${g.key})`;
      info.textContent=`Lands in ${g.repo} › ${g.inbox}/${ymd(new Date())}-foxboard/ as ${(ni.value||'art').replace(/[^a-z0-9_-]+/gi,'_')}.${what==='gif'?'gif':'png'} — the game's art inbox. ${g.direct?'':' Delivered by the Foxboard sweep.'} A Claude session imports it into the game from there.`;
    }
    gs.onchange=()=>{ gid=gs.value; setActiveGame(gid); upd(); }; ni.oninput=upd;
    b.append(row('Game',gs),row('Name',ni)); if(multi) b.append(row('What',...wb)); b.append(row('Scale',...sb),row('',kb),info);
    const go=h('button',{class:'acc'},'🚀 Send');
    go.onclick=async()=>{
      const g=gameById(gs.value)||games[0]; const [owner,repo]=g.repo.split('/');
      const name=(ni.value||'art').trim().replace(/[^a-z0-9_-]+/gi,'_').slice(0,60)||'art'; let lastSend=null;
      if(!g.direct){
        if(!dbCap){ out.classList.remove('hidden'); out.textContent='Sending needs Foxboard open inside the Claude app. Use Export here.'; return; }
        go.disabled=true; out.classList.remove('hidden'); out.textContent='Rendering…';
        try{
          let blob, ext;
          if(what==='gif'){ blob=makeGIF(scale); ext='gif'; }
          else { let c=what==='sheet'?renderSheet(scale,Math.min(doc.pages.length,8),0,false):renderToCanvas(scale,false); if(keyBg) c=onKey(c,g.key); blob=await new Promise(r=>c.toBlob(r,'image/png')); ext='png'; }
          if(!blob) throw {code:'too_big'};
          const now=new Date(), stamp=String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0')+String(now.getSeconds()).padStart(2,'0');
          out.textContent='Putting it in the outbox…';
          await queueOutbox(g,name,ext,blob,`${g.inbox}/${ymd(now)}-foxboard`,`${name}-${stamp}.${ext}`);
          out.textContent=`Queued ✓ ${name}.${ext} for ${g.name}. The Foxboard sweep drops it into ${g.inbox}/ on its next run (every few hours), or say "sweep the Foxboard outbox" in any Claude chat to do it now.`;
          toast('Queued for '+g.name);
        }catch(e){ out.textContent=e&&e.code==='too_big'?'Too big to send — lower the scale or send one frame.':e&&e.code==='invalid_argument'?'You can\'t send yet — Duff has to make you an Editor.':e&&e.code==='quota_exceeded'?'Outbox is full — wait for the sweep to clear it.':'Couldn\'t queue it ('+(e&&e.code||'error')+').'; }
        finally{ go.disabled=false; }
        return;
      }
      if(g.decoder===false){ out.classList.remove('hidden'); out.textContent=`${g.name}'s art inbox isn't switched on yet. Next time you open a Claude session on ${g.repo.split('/')[1]}, tell it: "apply Foxboard's integrations/duffquest-foxboard-inbox.patch, then flip the decoder on in Foxboard's bible". Until then, use Export.`; return; }
      go.disabled=true; out.classList.remove('hidden'); out.textContent='Rendering…';
      try{
        let blob, ext;
        if(what==='gif'){ blob=makeGIF(scale); ext='gif'; }
        else { let c=what==='sheet'?renderSheet(scale,Math.min(doc.pages.length,8),0,false):renderToCanvas(scale,false); if(keyBg) c=onKey(c,g.key); blob=await new Promise(r=>c.toBlob(r,'image/png')); ext='png'; }
        if(!blob) throw {code:'too_big'};
        const now=new Date(), stamp=String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0')+String(now.getSeconds()).padStart(2,'0');
        const dir=`${g.inbox}/${ymd(now)}-foxboard`, path=`${dir}/${name}-${stamp}.${ext}.b64`;
        lastSend={name,ext,blob,dir,file:`${name}-${stamp}.${ext}`};
        let content;
        const lt=await mcpCap.listTools().catch(()=>null);
        if(lt&&lt.fileArgs) content={$file:{data:blob,name:`${name}.${ext}`,type:ext==='gif'?'image/gif':'image/png'}};
        else { content=await blobToB64(blob); if(content.length>900000) throw {code:'too_big'}; }
        out.textContent='Sending to GitHub… (first time asks you to Allow)';
        await mcpCap.callTool('github','create_or_update_file',{owner,repo,branch:'main',path,content,message:`Foxboard: ${name}.${ext} from Duff's phone (auto-decodes to ${ext})`});
        out.innerHTML=''; out.append(`Sent ✓ ${name}.${ext} → ${g.name}. GitHub turns it into a real .${ext} in about a minute: `, h('a',{href:`https://github.com/${g.repo}/tree/main/${dir}`,target:'_blank',rel:'noopener'},'open the folder'));
        toast('Sent to '+g.name);
      }catch(e){
        const blocked=e&&(e.code==='server_not_connected'||e.code==='needs_reauth'||(e.code==='tool_error'&&/\b404\b|Not Found/i.test(String(e.message||''))));
        if(blocked&&dbCap&&lastSend){ try{ await queueOutbox(g,lastSend.name,lastSend.ext,lastSend.blob,lastSend.dir,lastSend.file); out.textContent='GitHub connector can\'t reach that repo, so it went to the outbox instead ✓ The Foxboard sweep delivers it.'; return; }catch(_){} }
        out.textContent=e&&e.code==='too_big'?'Too big to send — lower the scale or send one frame.':ghErr(e); }
      finally{ go.disabled=false; }
    };
    b.append(row('',go),out);
    b.append(h('div',{class:'hint'},'Goes into the game\'s grok_art inbox, never straight into the game, so nothing breaks the build.'));
    if(outboxItems.length){ b.append(h('h4',{style:'margin:12px 0 4px'},'Recent sends')); outboxItems.slice(0,8).forEach(it=>b.append(outboxLine(it))); }
    upd();
  });
}

/* ---------- shared library (everyone on Foxboard) ---------- */
let dbCap=null, userCap=null, userIsOwner=false, myUserId=null, canWriteShared=null;
let libItems=[], libNotes=[], libState='loading';
const names=new Map();
async function nameOf(ids){ ids=[...new Set(ids.filter(Boolean))].filter(i=>!names.has(i)); if(ids.length&&userCap){ try{ const ps=await userCap.profiles(ids); ids.forEach(i=>names.set(i,(ps[i]&&ps[i].name)||'Someone')); }catch(e){} } }
function who(id){ return id&&id===myUserId?'you':(names.get(id)||'Someone'); }
(async()=>{
  try{ if(window.claude&&window.claude.use){ [dbCap,userCap]=await Promise.all([window.claude.use('db'),window.claude.use('user')]); } }catch(e){}
  if(userCap){ try{ userIsOwner=!!userCap.isOwner(); }catch(e){} try{ myUserId=await userCap.id(); }catch(e){} try{ canWriteShared=await userCap.can('data.write'); }catch(e){ canWriteShared=null; } }
  if(!dbCap){ libState='off'; return; }
  const t=setTimeout(()=>{ if(libState==='loading') libState='slow'; },10000);
  dbCap.doc('bible/main').onSnapshot(s=>{ if(s.exists){ const b=s.data(); if(validBible(b)){ bible={games:JSON.parse(JSON.stringify(b.games)),characters:JSON.parse(JSON.stringify(b.characters))}; bibleSrc='shared'; } } },()=>{});
  dbCap.collection('library').orderBy('at','desc').limit(200).onSnapshot(s=>{
    clearTimeout(t); libState='ok'; libItems=s.docs.map(d=>({id:d.id,...d.data()}));
    nameOf(libItems.map(i=>i.by)).then(()=>{ if(sheetIs('library')) openLibrary(); });
  },e=>{ clearTimeout(t); libState='error:'+(e&&e.code); });
  dbCap.collection('outbox').orderBy('at','desc').limit(20).onSnapshot(s=>{ outboxItems=s.docs.map(d=>({id:d.id,...d.data()})); },()=>{});
  dbCap.collection('libnotes').orderBy('at','desc').limit(500).onSnapshot(s=>{
    libNotes=s.docs.map(d=>({id:d.id,...d.data()}));
    nameOf(libNotes.map(n=>n.by)).then(()=>{ if(sheetIs('libitem')) openLibItem(curLibItem); });
  },()=>{});
})();
let curSheet=null, curLibItem=null;
function sheetIs(k){ return curSheet===k && $('#sheet').classList.contains('open'); }
const CHUNK=180000;
async function shareCanvas(btn){
  endEdit();
  const json=JSON.stringify({...doc,cur:0});
  if(json.length>CHUNK*20){ toast('Too big to share (big images) — export it instead',2600); return; }
  btn.disabled=true; btn.textContent='Sharing…';
  const id=uid()+uid(), parts=[]; for(let i=0;i<json.length;i+=CHUNK) parts.push(json.slice(i,i+CHUNK));
  try{
    for(let n=0;n<parts.length;n++) await dbCap.doc(`libchunks/${id}_${n}`).set({item:id,n,data:parts[n]});
    const th=pageThumb(0,128).toDataURL('image/png');
    await dbCap.doc(`library/${id}`).set({name:doc.name||'Untitled',w:doc.w,h:doc.h,frames:doc.pages.length,pixel:!!doc.pixel,by:myUserId||'',at:Date.now(),thumb:th,chunks:parts.length});
    toast('Shared with everyone on Foxboard');
  }catch(e){ toast(e&&e.code==='quota_exceeded'?'Library is full — delete old items':e&&e.code==='invalid_argument'?'You can look but not share — Duff has to make you an Editor':'Share failed ('+(e&&e.code||'error')+')',3000); }
  btn.disabled=false; btn.textContent='⬆ Share this canvas';
}
async function openLibCanvas(it){
  try{
    toast('Opening…');
    const s=await dbCap.collection('libchunks').where('item','==',it.id).get();
    const parts=s.docs.map(d=>d.data()).sort((a,b)=>a.n-b.n);
    if(parts.length!==it.chunks) throw 0;
    useTemplate(migrate(JSON.parse(parts.map(p=>p.data).join(''))));
    toast('Opened a copy of "'+it.name+'"');
  }catch(e){ toast('Could not open that one'); }
}
async function deleteLibItem(it){
  try{ await dbCap.doc(`library/${it.id}`).delete(); for(let n=0;n<(it.chunks||0);n++) await dbCap.doc(`libchunks/${it.id}_${n}`).delete();
    for(const nt of libNotes.filter(x=>x.item===it.id)) await dbCap.doc(`libnotes/${nt.id}`).delete(); toast('Deleted'); }
  catch(e){ toast('Delete failed ('+(e&&e.code||'error')+')'); }
}
function fmtDate(t){ try{ return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return ''; } }
function openLibrary(){
  curSheet='library';
  openSheet('📚 Shared library','library',b=>{
    if(!dbCap){ b.append(h('div',{class:'out'},'The shared library works when Foxboard is open inside the Claude app (signed in). Duff shares Foxboard with you from its page in Claude.')); return; }

    else if(libState==='slow') b.append(h('div',{class:'hint'},'Can\'t reach the library yet — still trying.'));

    if(canWriteShared!==false){
      const ta=h('textarea',{placeholder:'Leave a note on this art…'});
      const send=h('button',{class:'acc'},'💬 Add note');
      send.onclick=async()=>{ const t=ta.value.trim(); if(!t) return; send.disabled=true; try{ await dbCap.collection('libnotes').add({item:it.id,text:t.slice(0,1000),by:myUserId||'',at:Date.now()}); ta.value=''; }catch(e){ toast(e&&e.code==='invalid_argument'?'Duff has to invite you as an Editor to leave notes':'Note failed'); } send.disabled=false; };
      b.append(ta,row('',send));
    }
  });
  curSheet='libitem';
}

/* ---------- export ---------- */
let downloads=null;
(async()=>{ try{ if(window.claude&&window.claude.use) downloads=await window.claude.use('downloads'); }catch(e){ downloads=null; } })();
function renderToCanvas(scale,jpg,pi){
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(doc.w*scale)); c.height=Math.max(1,Math.round(doc.h*scale));
  renderPage(c.getContext('2d'),pi===undefined?doc.cur:pi,scale,jpg); return c;
}
function renderSheet(scale,cols,pad,jpg){
  const n=doc.pages.length, rows=Math.ceil(n/cols), fw=Math.round(doc.w*scale), fh=Math.round(doc.h*scale);
  const c=document.createElement('canvas'); c.width=cols*fw+(cols-1)*pad; c.height=rows*fh+(rows-1)*pad;
  const g=c.getContext('2d');
  if(jpg){ g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); }
  doc.pages.forEach((p,i)=>{ g.save(); g.translate((i%cols)*(fw+pad),Math.floor(i/cols)*(fh+pad)); g.beginPath(); g.rect(0,0,fw,fh); g.clip(); renderPage(g,i,scale,jpg); g.restore(); });
  return c;
}
function slug(){ return (doc.name||'foxboard').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'foxboard'; }
async function deliver(blob,filename,fallback){
  if(downloads){
    try{ await downloads.save({filename,data:blob}); toast('Saved '+filename); return; }
    catch(e){ if(e&&e.code==='declined'){ toast('Cancelled'); return; } if(e&&e.code==='rate_limited'){ toast('One save at a time — try again'); return; } }
  }
  if(fallback) fallback(); else toast('Saving files is not available here — open Foxboard in the Claude app');
}
function openExport(){
  if(drawMode) setDrawMode(false);
  selId=null; refreshUI(); draw();
  openSheet('Export','export',b=>{
    const multi=doc.pages.length>1;
    let what=multi?'sheet':'frame', scale=doc.pixel?Math.max(1,Math.min(8,Math.floor(1024/Math.max(doc.w,doc.h))||1)):1, fmt='png', cols=Math.min(doc.pages.length,8), pad=0;
    const info=h('div',{class:'hint'});
    const dims=()=>{ if(what==='frame') return [Math.round(doc.w*scale),Math.round(doc.h*scale)]; const n=doc.pages.length, r=Math.ceil(n/cols); return [cols*Math.round(doc.w*scale)+(cols-1)*pad, r*Math.round(doc.h*scale)+(r-1)*pad]; };
    const wb=[['frame','This frame'],['sheet','Sprite sheet']].map(([k,l])=>{ const bt=h('button',{},l); bt.onclick=()=>{ what=k; upd(); }; bt.dataset.k=k; return bt; });
    const sb=[0.5,1,2,4,8,16].filter(s=>Math.max(doc.w,doc.h)*s<=8192 && Math.max(doc.w,doc.h)*s>=8).map(s=>{ const bt=h('button',{},s+'×'); bt.dataset.s=s; bt.onclick=()=>{ scale=s; upd(); }; return bt; });
    const fb=['png','jpg','gif'].map(f=>{ const bt=h('button',{},f.toUpperCase()); bt.dataset.f=f; bt.onclick=()=>{ fmt=f; upd(); }; return bt; });
    const colsIn=h('input',{type:'number',min:1,max:64,value:cols}); colsIn.oninput=()=>{ cols=Math.max(1,Math.min(64,+colsIn.value||1)); upd(); };
    const padIn=h('input',{type:'number',min:0,max:64,value:0}); padIn.oninput=()=>{ pad=Math.max(0,Math.min(64,+padIn.value||0)); upd(); };
    const sheetRow=row('Grid',h('span',{},'cols'),colsIn,h('span',{},'gap'),padIn);
    function upd(){
      const [W,H]=dims();
      info.textContent=`${W} × ${H} px · ${fmt.toUpperCase()}${fmt==='png'&&(!doc.bg||doc.bg==='transparent')?' · transparent':''}${what==='sheet'?` · ${doc.pages.length} frames, ${Math.round(doc.w*scale)}×${Math.round(doc.h*scale)} each`:''}`;
      wb.forEach(x=>x.classList.toggle('on',x.dataset.k===what)); sb.forEach(x=>x.classList.toggle('on',+x.dataset.s===scale)); fb.forEach(x=>x.classList.toggle('on',x.dataset.f===fmt));
      sheetRow.classList.toggle('hidden',what!=='sheet'||fmt==='gif');
      wb.forEach(x=>x.disabled=fmt==='gif');
      if(fmt==='gif') info.textContent=gifInfo();
    }
    if(multi) b.append(row('What',...wb));
    b.append(row('Scale',...sb)); b.append(row('Format',...fb)); b.append(sheetRow); b.append(info);
    const gifInfo=()=>{ const W=Math.round(doc.w*scale),H=Math.round(doc.h*scale); return `${W} × ${H} px · animated GIF · ${doc.pages.length} frame${doc.pages.length>1?'s':''} @ ${doc.fps} fps${(!doc.bg||doc.bg==='transparent')?' · transparent':''}`; };
    const make=()=>{ const [W,H]=dims(); if(W*H>67e6){ toast('Too big — lower the scale'); return null; } return what==='sheet'?renderSheet(scale,cols,pad,fmt==='jpg'):renderToCanvas(scale,fmt==='jpg'); };
    const go=h('button',{class:'acc'},'⬇ Save image');
    go.onclick=()=>{
      if(fmt==='gif'){ const W=doc.w*scale,H=doc.h*scale; if(W*H*doc.pages.length>40e6){ toast('GIF too big — lower the scale'); return; }
        go.disabled=true; go.textContent='Encoding…';
        setTimeout(()=>{ let blob; try{ blob=makeGIF(scale); }catch(e){ toast('GIF failed — try a smaller scale'); }
          go.disabled=false; go.textContent='⬇ Save image'; if(!blob) return;
          const fn=`${slug()}${scale!==1?'@'+scale+'x':''}.gif`;
          deliver(blob,fn,()=>{ const u=URL.createObjectURL(blob); $('#ivImg').src=u; $('#imgview').classList.add('open'); }); },30);
        return; }
      const c=make(); if(!c) return;
      c.toBlob(blob=>{ if(!blob){ toast('Too big to export — try a smaller scale'); return; }
        const fn=`${slug()}${what==='sheet'?'-sheet':''}${scale!==1?'@'+scale+'x':''}.${fmt}`;
        deliver(blob,fn,()=>showImage(c,fmt)); }, fmt==='jpg'?'image/jpeg':'image/png', 0.92); };
    const pv=h('button',{onclick:()=>{ if(fmt==='gif'){ try{ const u=URL.createObjectURL(makeGIF(scale)); $('#ivImg').src=u; $('#imgview').classList.add('open'); }catch(e){ toast('GIF failed — try a smaller scale'); } return; } const c=make(); if(c) showImage(c,fmt); }},'👁 Preview');
    b.append(row('',go,pv));
    b.append(row('',h('button',{onclick:openSendToGame},'🎮 Send to game instead')));
    b.append(h('div',{class:'hint'},doc.pixel?'Pixel art: 1× for in-game use, 4–8× to share. Sprite sheet frames go left→right, top→bottom.':'Tip: 2× is sharper on phone screens.'));
    upd();
  });
}
function showImage(c,fmt){ $('#ivImg').src=c.toDataURL(fmt==='jpg'?'image/jpeg':'image/png',0.92); $('#imgview').classList.add('open'); }
$('#ivClose').onclick=()=>{ $('#imgview').classList.remove('open'); $('#ivImg').removeAttribute('src'); };

function saveProject(){
  endEdit();
  const blob=new Blob([JSON.stringify({app:'foxboard',v:2,doc})],{type:'application/json'});
  deliver(blob,slug()+'.foxboard.json',null);
}
$('#fileProj').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{ const j=JSON.parse(fr.result); const d=migrate(j.doc||j); if(drawMode) setDrawMode(false); beginEdit(); doc=d; selId=null; endEdit(); closeSheet(); refreshUI(); renderPages(); fit(); toast('Opened '+(doc.name||'project')); }catch(err){ toast('That file is not a Foxboard project'); } };
  fr.readAsText(f);
});

/* ---------- wiring ---------- */
function refreshUI(){
  const t=$('#docTitle'); t.innerHTML=''; t.append(document.createTextNode(doc.name||'Untitled'),h('small',{},`${doc.w}×${doc.h}${doc.pixel?' · px':''}`));
  $('#ctx').classList.toggle('show',!!sel() && !drawMode);
}
$('#bUndo').onclick=undo; $('#bRedo').onclick=redo;
$('#bMenu').onclick=openMenu; $('#bExport').onclick=openExport;
$('#tText').onclick=addText; $('#tShape').onclick=openShapes; $('#tImg').onclick=()=>$('#fileImg').click();
$('#tDraw').onclick=()=>setDrawMode(!drawMode); $('#tAI').onclick=()=>openAI(); $('#tLayers').onclick=openLayers; $('#tFit').onclick=fit;
$('#fileImg').addEventListener('change',e=>{ const f=e.target.files[0]; e.target.value=''; addImageFile(f); });
$('#docTitle').onclick=openCanvas;
window.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
  else if(e.key==='Delete'||e.key==='Backspace'){ del(); }
});
window.addEventListener('resize',resize);
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) addImageFile(f); });

loadAuto();
loadTemplates();
for(const p of doc.pages) for(const o of p.objects) if(o.type==='image') getImg(o.src);
refreshUI(); updUndo(); resize(); fit(); renderPages(); updDrawbar();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ for(const p of doc.pages) for(const o of p.objects) if(o.type==='text') fitText(o); draw(); thumbsSoon(); });
if(!doc.pages.some(p=>p.objects.length)) setTimeout(()=>toast('Tap Text, Shape, Image, Draw or ✨AI to start',2600),400);
window.__fb={get doc(){return doc;},set doc(d){doc=migrate(d);afterLoad();},get sel(){return selId;},set sel(v){selId=v;refreshUI();draw();},makeGIF,BUILTIN,useTemplate,openSendToGame,setActiveGame,forgeCheck,get forgeJobs(){return forgeJobs;},setDirect:(id,v)=>{ const g=gameById(id); if(g) g.direct=v; },openBible,openAI,snapToPalette,openLibrary,startNew,shareCanvas,get myTemplates(){return myTemplates;},addText,addShape,undo,redo,renderToCanvas,renderSheet,fit,parsePixels,cleanSVG,removeBg,setDrawMode,get view(){return view;}};
})();
</script>
